<svg width="1000" height="120" viewBox="0 0 1000 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="w1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#a855f7;#00f0ff" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff2d78">
        <animate attributeName="stop-color" values="#ff2d78;#00f0ff;#ff2d78" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <path fill="url(#w1)" opacity="0.25" d="M0,60 C150,100 350,20 500,60 C650,100 850,20 1000,60 L1000,120 L0,120 Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,60 C150,100 350,20 500,60 C650,100 850,20 1000,60 L1000,120 L0,120 Z;
              M0,60 C150,20 350,100 500,60 C650,20 850,100 1000,60 L1000,120 L0,120 Z;
              M0,60 C150,100 350,20 500,60 C650,100 850,20 1000,60 L1000,120 L0,120 Z"/>
  </path>
  <path fill="url(#w1)" opacity="0.45" d="M0,80 C200,110 400,50 600,80 C750,100 900,60 1000,80 L1000,120 L0,120 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,80 C200,110 400,50 600,80 C750,100 900,60 1000,80 L1000,120 L0,120 Z;
              M0,80 C200,50 400,110 600,80 C750,60 900,100 1000,80 L1000,120 L0,120 Z;
              M0,80 C200,110 400,50 600,80 C750,100 900,60 1000,80 L1000,120 L0,120 Z"/>
  </path>

  <text x="500" y="52" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" letter-spacing="3" fill="#8be9fd" opacity="0.85">
    &lt; BUILDING THE NEXT REALITY /&gt;
    <animate attributeName="opacity" values="0.85;0.35;0.85" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
