<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Sweeping sheen over the name -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="45%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>

    <radialGradient id="glowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="14" fill="url(#bgGrad)"/>

  <ellipse cx="500" cy="160" rx="420" ry="150" fill="url(#glowCore)">
    <animate attributeName="rx" values="420;480;420" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Perspective floor grid -->
  <g stroke="url(#fadeGrid)" stroke-width="1">
    <line x1="500" y1="192" x2="-150" y2="300"/>
    <line x1="500" y1="192" x2="60" y2="300"/>
    <line x1="500" y1="192" x2="230" y2="300"/>
    <line x1="500" y1="192" x2="380" y2="300"/>
    <line x1="500" y1="192" x2="500" y2="300"/>
    <line x1="500" y1="192" x2="620" y2="300"/>
    <line x1="500" y1="192" x2="770" y2="300"/>
    <line x1="500" y1="192" x2="940" y2="300"/>
    <line x1="500" y1="192" x2="1150" y2="300"/>
  </g>
  <!-- Grid horizontals scrolling toward viewer -->
  <g stroke="#8a8a8a" stroke-width="1">
    <line x1="0" y1="0" x2="1000" y2="0" opacity="0">
      <animate attributeName="y1" values="198;300" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="198;300" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="1000" y2="0" opacity="0">
      <animate attributeName="y1" values="198;300" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="198;300" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="1000" y2="0" opacity="0">
      <animate attributeName="y1" values="198;300" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="198;300" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Drifting particles -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="70" r="2.2" opacity="0.4">
      <animate attributeName="cy" values="70;95;70" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="200" r="1.4" opacity="0.35">
      <animate attributeName="cy" values="200;175;200" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="190" r="1.6" opacity="0.35">
      <animate attributeName="cy" values="190;215;190" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="150" r="1.2" opacity="0.3">
      <animate attributeName="cx" values="60;80;60" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="140" r="1.2" opacity="0.3">
      <animate attributeName="cx" values="940;915;940" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left: VR headset wireframe, floating -->
  <g stroke="#ffffff" stroke-width="2.2" fill="none" filter="url(#softNeon)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="150,105;150,98;150,105" dur="4s" repeatCount="indefinite"/>
    <rect x="0" y="10" width="86" height="46" rx="16"/>
    <path d="M 14 56 Q 20 70 34 66 L 52 66 Q 66 70 72 56"/>
    <circle cx="26" cy="33" r="9">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="33" r="9">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right: code glyph, floating opposite phase -->
  <g filter="url(#softNeon)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="770,108;770,115;770,108" dur="4s" repeatCount="indefinite"/>
    <text x="0" y="34" font-family="'Courier New',monospace" font-size="44" font-weight="bold" fill="#ffffff">&lt;/&gt;</text>
  </g>

  <!-- Name with sweeping sheen -->
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="8" fill="url(#sheen)" filter="url(#neon)">
    DHANILKA
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Subtitle + blinking cursor -->
  <g font-family="'Courier New',monospace" font-size="16" fill="#9a9a9a">
    <text x="500" y="175" text-anchor="middle" letter-spacing="2" opacity="0">
      XR ENGINEER · FULL-STACK DEVELOPER · BUILDER OF WORLDS
      <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/>
    </text>
    <text x="748" y="175" fill="#ffffff" opacity="0">
      _
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Scan line sweep -->
  <rect x="0" y="0" width="1000" height="2" fill="#ffffff" opacity="0.12" rx="1">
    <animate attributeName="y" values="0;298;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Border pulse -->
  <rect x="1.5" y="1.5" width="997" height="297" rx="13" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
