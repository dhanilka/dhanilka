name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates daily at midnight UTC
  workflow_dispatch:        # allows manual run from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-mono.svg?color_snake=#ffffff&color_dots=#0c0c0c,#2a2a2a,#555555,#9a9a9a,#ffffff

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
